<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    airlink app icon. no text, no words, per apple hig.
    glyph: a qr finder corner with three signal arcs radiating out of it — the two halves of
    what the app does, reduced to one mark.
    brand gradient: bright teal #2DD4BF into deep teal #0F766E.
    export at 1024x1024 png, opaque, square, no rounded corners and no alpha: ios masks it.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g fill="none" stroke="#F8FAFC" stroke-linecap="round" stroke-width="54">
    <!-- qr finder corner, bottom left: the receiving surface -->
    <path d="M300 724 L300 604"/>
    <path d="M300 724 L420 724"/>

    <!-- three arcs radiating from that corner: the signal in flight -->
    <path d="M300 476 A248 248 0 0 1 548 724" opacity="0.95"/>
    <path d="M300 344 A380 380 0 0 1 680 724" opacity="0.72"/>
    <path d="M300 212 A512 512 0 0 1 812 724" opacity="0.45"/>
  </g>
</svg>
